[CLOUDS]
COVER=0.4 ; regulates clouds transparency : 0 -> 1
CUTOFF=0.85 ; regulates other colors influencies on the cloud : 0->1 if 1 just the color of the cloud is considered, if 0.4 just the color effects on the clouds are considered, if 0.5 50% of cloud color and 50% of effects
COLOR=1.5 ; base color, the sunlight, light color and ambient will be added to this : 0 -> 1
WIDTH=25 ; width of the quad
HEIGHT=12 ; height of the quad
RADIUS=10 ; distance from the center of the skybox of the quad
NUMBER=45 ; number of clouds
BASE_SPEED_MULT=0.004

[FOG]
COLOR=1.45,1.55,1.65
BLEND=0.6
DISTANCE=12000

[LAUNCHER]
NAME=Mid Clouds ; name of the weather as it will appear in the launcher menus
TEMPERATURE_COEFF=-0.3 ; values -1 to 1. Creates a variation of the asphalt temperature relative to the weather, ambient temperature and time. See the readme_weather.txt for explanation

[CAR_LIGHTS]
FORCE_ON=1