; Sample Shutoko Revival Project freeroam server (cfg/srp/README.md).
; Needs the SRP track and the cars below in --content, and the AI traffic
; settings in extra_cfg.yml.
[SERVER]
NAME=SRP Freeroam
CARS=srp_bcnr33_wangan;sl_toyota_supra_mkiv_ridox;wm_nissan_s15;ddm_mazda_fc3s_re;j8_ae86_tuned_coupe;pear_nissan_silvia_s13_wangan;traffic_toyota_prius;traffic_aegis_toyota_markii_taxi;traffic_isuzu_npr;traffic_nissan_leaf;traffic_toyota_camry;traffic_aegis_toyota_vellfire
TRACK=shutoko_revival_project_094_ptb1
CONFIG_TRACK=main_layout
SUN_ANGLE=-8
TIME_OF_DAY_MULT=1
PASSWORD=
ADMIN_PASSWORD=change-me
UDP_PORT=9600
TCP_PORT=9600
HTTP_PORT=8081
; Every entry-list slot, players and traffic (main_layout has 170 pit boxes).
MAX_CLIENTS=80
CLIENT_SEND_INTERVAL_HZ=18
REGISTER_TO_LOBBY=1
; AI traffic needs pickup mode.
PICKUP_MODE_ENABLED=1
LOOP_MODE=1
ABS_ALLOWED=1
TC_ALLOWED=1
STABILITY_ALLOWED=0
AUTOCLUTCH_ALLOWED=1
TYRE_BLANKETS_ALLOWED=1
FORCE_VIRTUAL_MIRROR=0
FUEL_RATE=0
DAMAGE_MULTIPLIER=0
TYRE_WEAR_RATE=0
ALLOWED_TYRES_OUT=4
MAX_CONTACTS_PER_KM=-1
LEGAL_TYRES=
VOTING_QUORUM=80
VOTE_DURATION=20
KICK_QUORUM=85
BLACKLIST_MODE=1

; One long practice session as freeroam; LOOP_MODE restarts it.
[PRACTICE]
NAME=Freeroam
TIME=600
IS_OPEN=1

[DYNAMIC_TRACK]
SESSION_START=100
RANDOMNESS=0
SESSION_TRANSFER=100
LAP_GAIN=1

[WEATHER_0]
GRAPHICS=3_clear
BASE_TEMPERATURE_AMBIENT=20
BASE_TEMPERATURE_ROAD=6
VARIATION_AMBIENT=1
VARIATION_ROAD=1
WIND_BASE_SPEED_MIN=0
WIND_BASE_SPEED_MAX=2
WIND_BASE_DIRECTION=0
WIND_VARIATION_DIRECTION=30
