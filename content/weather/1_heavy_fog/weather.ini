[CLOUDS]
COVER=0 ; regulates clouds transparency : 0 -> 1
CUTOFF=0.69 ; regulates other colors influencies on the cloud : 0->1 if 1 just the color of the cloud is considered, if 0 just the color effects on the clouds are considered, if 0.5 50% of cloud color and 50% of effects
COLOR=0.3 ; base color, the sunlight, light color and ambient will be added to this : 0 -> 1
WIDTH=16 ; width of the quad
HEIGHT=7 ; height of the quad
RADIUS=10 ; distance from the center of the skybox of the quad
NUMBER=0 ; number of clouds
BASE_SPEED_MULT=0.0015

[FOG]
COLOR=4.5,4.5,4.5
BLEND=1.0
DISTANCE=900

[LAUNCHER]
NAME=Heavy Fog ; name of the weather as it will appear in the launcher menus
TEMPERATURE_COEFF=-0.5 ; values -1 to 1. Creates a variation of the asphalt temperature relative to the weather, ambient temperature and time. See the readme_weather.txt for explanation

[CAR_LIGHTS]
FORCE_ON=1