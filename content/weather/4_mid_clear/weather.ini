[CLOUDS]
COVER=0.9 ; regulates clouds transparency : 0 -> 1
CUTOFF=0.5 ; regulates other colors influencies on the cloud : 0->1 if 1 just the color of the cloud is considered, if 0 just the color effects on the clouds are considered, if 0.5 50% of cloud color and 50% of effects
COLOR=0.7 ; base color, the sunlight, light color and ambient will be added to this : 0 -> 1
WIDTH=9 ; width of the quad
HEIGHT=4 ; height of the quad
RADIUS=6 ; distance from the center of the skybox of the quad
NUMBER=40 ; number of clouds
BASE_SPEED_MULT=0.00150

[FOG]
COLOR=1.9,2.45,3.32
BLEND=0.75
DISTANCE=8000

[LAUNCHER]
NAME=Mid Clear ; name of the weather as it will appear in the launcher menus
TEMPERATURE_COEFF=1 ; values -1 to 1. Creates a variation of the asphalt temperature relative to the weather, ambient temperature and time. See the readme_weather.txt for explanation
