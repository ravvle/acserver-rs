[CLOUDS]
COVER=1 ; regulates clouds transparency : 0 -> 1
CUTOFF=0.7 ; regulates other colors influencies on the cloud : 0->1 if 1 just the color of the cloud is considered, if 0 just the color effects on the clouds are considered, if 0.5 50% of cloud color and 50% of effects
COLOR=3.05 ; base color, the sunlight, light color and ambient will be added to this : 0 -> 1
WIDTH=18 ; width of the quad
HEIGHT=9 ; height of the quad
RADIUS=10 ; distance from the center of the skybox of the quad
NUMBER=50 ; number of clouds
BASE_SPEED_MULT=0.004

[FOG]
COLOR=1.9,2.45,3.32
BLEND=0.7
DISTANCE=12000

[LAUNCHER]
NAME=Light Clouds ; name of the weather as it will appear in the launcher menus
TEMPERATURE_COEFF=-0.3 ; values -1 to 1. Creates a variation of the asphalt temperature relative to the weather, ambient temperature and time. See the readme_weather.txt for explanation